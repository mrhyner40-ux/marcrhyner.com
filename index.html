---
layout: default
---

<main class="hero">
  <div class="glow" data-glow data-shape="hexagon">
    <canvas class="glow-canvas" aria-hidden="true"></canvas>
    <img class="mark glow-fallback" src="{{ '/assets/img/mr-mark.svg' | relative_url }}" alt="" width="160" height="160">
  </div>

  <h1 class="name">Marc Rhyner</h1>
  <p class="tagline">{{ site.description }}</p>

  <hr class="rule">

  <a class="button" href="mailto:{{ site.email }}">Get in touch</a>
</main>
